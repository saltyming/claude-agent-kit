name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# This kit ships rules, skills, and installer scripts only. The aside and
# dispatch binaries are built and published by slate-agent-kit's release.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
