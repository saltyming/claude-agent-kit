name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scripts:
    name: installer scripts (syntax + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: POSIX sh syntax
        run: |
          for f in install.sh scripts/*.sh; do
            sh -n "$f"
          done
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in @("install.ps1") + (Get-ChildItem scripts/*.ps1 | ForEach-Object FullName)) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) { Write-Host "${f}: $($errors.Count) parse error(s)"; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # Advisory, as in slate-agent-kit's CI.
      - name: shellcheck
        run: shellcheck -s sh install.sh scripts/*.sh || true
